<!DOCTYPE html>
<html>
<head>
    <title>Simple Greeting App</title>
</head>
<body>

    <h2>Simple Greeting App</h2>

    <form method="POST">
        <label for="name">Enter Your Name:</label>
        <input type="text" id="name" name="name">
        <button type="submit">Submit</button>
    </form>

    {% if name %}
        <p>Hello, {{ name }}!</p>
    {% endif %}

</body>
</html>
